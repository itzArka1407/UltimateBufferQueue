[package]
name = "buffer-queue"
version = "0.1.0"
edition = "2024"
authors = ["Arka <arkaprovodas2004@gmail.com>"]
repository = "https://github.com/itzArka1407/UltimateBufferQueue/"
description = "A flexible performant buffer for different use cases like SPSC, MPSC, etc..."
license = "MIT OR Apache-2.0"

[dependencies]
atomic-waker = "1.1.2"
parking_lot = { version = "0.12.5", optional = true }
spin = { version = "0.12.3", default-features = false, features = [
    "mutex",
    "spin_mutex",
] }
triomphe = { version = "0.1.15", default-features = false }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync"] }
criterion = { version = "0.8.2", features = ["async_tokio"] }
crossbeam-queue = "0.3.13"
flume = "0.12.0"

[[bench]]
name = "comparison"
harness = false

[features]
default = ["std"]
std = ["triomphe/std", "dep:parking_lot"]
